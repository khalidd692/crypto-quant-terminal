name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  typecheck-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: node --experimental-strip-types tests/domain-validation.ts
      - run: node --experimental-strip-types tests/core-invariants.ts
      - run: node --experimental-strip-types tests/protocol-invariants.ts
