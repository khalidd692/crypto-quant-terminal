name: CI
# CI validation gate for pull requests.

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run test:runner-self-test
      - run: node dist/tests/domain-validation.js
      - run: node dist/tests/core-invariants.js
      - run: node dist/tests/protocol-invariants.js
      - run: node dist/tests/dataset-and-indicators.js
      - run: node dist/tests/baseline-backtest.js
      - run: node dist/tests/expectancy.js
      - run: node dist/tests/veto-and-timeframe.js
      - run: node dist/tests/calibration.js
      - run: node dist/tests/walk-forward.js
      - run: node dist/tests/walk-forward-runner.js
      - run: node dist/tests/research-ledger.js
      - run: node dist/tests/market-data-integrity.js
      - run: node dist/tests/historical-dataset.js
      - run: node dist/tests/statistics-bootstrap.js
      - run: node dist/tests/research-report.js
      - run: node dist/tests/purged-split.js
      - run: node dist/tests/outcome-accounting.js
      - run: node dist/tests/funding-alignment.js
      - run: node dist/tests/empirical-probability.js
      - run: node dist/tests/multi-outcome-probability.js
      - run: node dist/tests/oos-calibration.js
      - run: node dist/tests/evidence-gate.js
      - run: node dist/tests/decision-pipeline.js
      - run: node dist/tests/experiment-registry.js
      - run: node dist/tests/risk-sizing.js
      - run: node dist/tests/final-holdout.js
      - run: node dist/tests/tel-usdt-surveillance.js
      - name: Read-only live TEL entry smoke
        env:
          PROSPECTIVE_JOURNAL: /tmp/tel-entry-smoke-journal.jsonl
          TEL_DECISION_HTML: /tmp/tel-entry-smoke.html
          SWING_CAPITAL_QUOTE: "1000"
        run: |
          rm -f "$PROSPECTIVE_JOURNAL" "$TEL_DECISION_HTML"
          node dist/src/automation/runner.js
          test -s "$PROSPECTIVE_JOURNAL"
          test -s "$TEL_DECISION_HTML"
          grep -q "EN TEST — SANS ARGENT" "$TEL_DECISION_HTML"
          echo "LIVE_SMOKE_ARTIFACT=$TEL_DECISION_HTML"
          echo "LIVE_SMOKE_JOURNAL=$PROSPECTIVE_JOURNAL"
      - name: Upload read-only live smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tel-entry-live-smoke
          path: |
            /tmp/tel-entry-smoke.html
            /tmp/tel-entry-smoke-journal.jsonl
          if-no-files-found: warn
