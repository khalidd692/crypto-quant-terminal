name: Temporary TEL source formatter
on:
  push:
    branches: ["style/tel-pipeline-format"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: style/tel-pipeline-format
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Format requested surveillance files
        run: npx --yes prettier@3.6.2 --print-width 110 --write src/surveillance/tel-entry-pipeline.ts src/surveillance/tel-test-mode.ts src/surveillance/tel-swing.ts src/risk/liquidity.ts
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/surveillance/tel-entry-pipeline.ts src/surveillance/tel-test-mode.ts src/surveillance/tel-swing.ts src/risk/liquidity.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format TEL surveillance pipeline"
          git push origin HEAD:style/tel-pipeline-format
