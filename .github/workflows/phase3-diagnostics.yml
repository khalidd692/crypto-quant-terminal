name: Phase 3 diagnostic export

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "src/research/**"
      - "scripts/freeze-funding-archive.mjs"
      - ".github/workflows/phase3-diagnostics.yml"

jobs:
  diagnostic-export:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/freeze-funding-archive.mjs
      - run: npm run build
      - run: PHASE3_FUNDING_DIR=research/funding/frozen-btcusdt-2020-2025 node dist/src/research/phase3-diagnostics-cli.js
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-diagnostic-export
          path: research/diagnostics/phase3-diagnostic-20261008.json
          if-no-files-found: error
