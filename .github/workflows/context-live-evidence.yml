name: Context Live Evidence
on:
  push:
    branches: [main]
    paths:
      - "src/context/**"
      - "scripts/context-live-smoke.mjs"
      - ".github/workflows/context-live-evidence.yml"
  workflow_dispatch:
jobs:
  live-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Live context smoke
        env:
          CONTEXT_HTTP_TIMEOUT_MS: "8000"
          CONTEXT_HTTP_RETRIES: "0"
        run: node scripts/context-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: context-live-evidence
          path: artifacts/context-live.json
