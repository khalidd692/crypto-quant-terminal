name: Prospective surveillance
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/prospective-surveillance.yml"
      - "src/automation/**"
      - "src/surveillance/**"
      - "src/context/providers/**"
      - "scripts/summarize-tel-vetoes.mjs"
      - "package.json"
  workflow_dispatch:
    inputs:
      planned_order_type:
        description: "Type ordre prévu"
        required: true
        type: choice
        options: ["LIMIT", "MARKET"]
      order_grid_state:
        description: "État de la grille"
        required: true
        type: choice
        options: ["ACTIVE", "INACTIVE"]
      last_grid_level_price:
        description: "Dernier niveau de grille TEL/USDT (laisser vide si inconnu)"
        required: false
        type: string
      anti_fomo_started_at:
        description: "Début du délai de réflexion UTC (ex. 2026-10-09T12:00:00Z)"
        required: false
        type: string
      tranche_count_in_zone:
        description: "Tranches déjà utilisées dans cette zone"
        required: false
        type: string
      max_tranches_per_zone:
        description: "Plafond de tranches dans cette zone (défaut 3)"
        required: false
        type: string
      last_tranche_price:
        description: "Prix de la dernière tranche (si connu)"
        required: false
        type: string
      planned_entry_price:
        description: "Prix prévu pour l'entrée"
        required: false
        type: string
concurrency:
  group: prospective-surveillance-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  surveillance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Snapshot journal baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tel-journal-merge
          : > /tmp/tel-journal-merge/before.jsonl
          if test -f research/prospective/journal.jsonl; then cp research/prospective/journal.jsonl /tmp/tel-journal-merge/before.jsonl; fi
      - name: Run prospective surveillance
        env:
          PROSPECTIVE_JOURNAL: research/prospective/journal.jsonl
          SURVEILLANCE_CONFIG: config/surveillance-assets.json
          CONTEXT_HTTP_TIMEOUT_MS: "3500"
          CONTEXT_HTTP_RETRIES: "1"
          TEL_PLANNED_ORDER_TYPE: ${{ inputs.planned_order_type || secrets.TEL_PLANNED_ORDER_TYPE }}
          TEL_ORDER_GRID_STATE: ${{ inputs.order_grid_state || secrets.TEL_ORDER_GRID_STATE }}
          TEL_LAST_GRID_LEVEL_PRICE: ${{ inputs.last_grid_level_price || secrets.TEL_LAST_GRID_LEVEL_PRICE }}
          TEL_ANTI_FOMO_STARTED_AT: ${{ inputs.anti_fomo_started_at || secrets.TEL_ANTI_FOMO_STARTED_AT }}
          TEL_ANTI_FOMO_REASON: ${{ secrets.TEL_ANTI_FOMO_REASON }}
          TEL_TRANCHE_COUNT_IN_ZONE: ${{ inputs.tranche_count_in_zone || secrets.TEL_TRANCHE_COUNT_IN_ZONE }}
          TEL_MAX_TRANCHES_PER_ZONE: ${{ inputs.max_tranches_per_zone || secrets.TEL_MAX_TRANCHES_PER_ZONE }}
          TEL_LAST_TRANCHE_PRICE: ${{ inputs.last_tranche_price || secrets.TEL_LAST_TRANCHE_PRICE }}
          TEL_PLANNED_ENTRY_PRICE: ${{ inputs.planned_entry_price || secrets.TEL_PLANNED_ENTRY_PRICE }}
        run: node dist/src/automation/runner.js
      - name: Reconcile and append journal safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tel-journal-merge research/prospective
          if test -f research/prospective/journal.jsonl; then
            cp research/prospective/journal.jsonl /tmp/tel-journal-merge/after.jsonl
          else
            : > /tmp/tel-journal-merge/after.jsonl
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p research/prospective
            if ! test -f research/prospective/journal.jsonl; then : > research/prospective/journal.jsonl; fi
            node scripts/reconcile-prospective-journal.mjs /tmp/tel-journal-merge/before.jsonl /tmp/tel-journal-merge/after.jsonl research/prospective/journal.jsonl
            git add research/prospective/journal.jsonl
            if git diff --cached --quiet; then
              echo "No new journal records to append."
              exit 0
            fi
            git commit -m "automation: append prospective surveillance journal"
            if git push origin HEAD:main; then
              echo "Journal append and hash-chain verification succeeded."
              exit 0
            fi
            echo "Concurrent main update detected; retrying against latest main (attempt $attempt/4)."
          done
          echo "Unable to append journal safely after 4 attempts." >&2
          exit 1
      - name: Weekly angle availability and veto summary
        if: success()
        env:
          PROSPECTIVE_JOURNAL: research/prospective/journal.jsonl
        run: node scripts/summarize-tel-vetoes.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Alert summary
        if: always()
        run: |
          echo "Prospective surveillance completed; journal is append-only and hash chained." >> "$GITHUB_STEP_SUMMARY"
