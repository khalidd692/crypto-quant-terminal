name: Prospective surveillance
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      planned_order_type:
        description: "Type ordre prévu"
        required: true
        type: choice
        options: ["LIMIT", "MARKET"]
      order_grid_state:
        description: "État de la grille"
        required: true
        type: choice
        options: ["ACTIVE", "INACTIVE"]
      last_grid_level_price:
        description: "Dernier niveau de grille TEL/USDT (laisser vide si inconnu)"
        required: false
        type: string
      anti_fomo_started_at:
        description: "Début du délai de réflexion UTC (ex. 2026-10-09T12:00:00Z)"
        required: false
        type: string
      tranche_count_in_zone:
        description: "Tranches déjà utilisées dans cette zone"
        required: false
        type: string
      max_tranches_per_zone:
        description: "Plafond de tranches dans cette zone (défaut 3)"
        required: false
        type: string
      last_tranche_price:
        description: "Prix de la dernière tranche (si connu)"
        required: false
        type: string
      planned_entry_price:
        description: "Prix prévu pour l'entrée"
        required: false
        type: string
concurrency:
  group: prospective-surveillance-main
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  surveillance:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Run prospective surveillance
        env:
          PROSPECTIVE_JOURNAL: research/prospective/journal.jsonl
          SURVEILLANCE_CONFIG: config/surveillance-assets.json
          CONTEXT_HTTP_TIMEOUT_MS: "3500"
          CONTEXT_HTTP_RETRIES: "1"
          TEL_PLANNED_ORDER_TYPE: ${{ inputs.planned_order_type || secrets.TEL_PLANNED_ORDER_TYPE }}
          TEL_ORDER_GRID_STATE: ${{ inputs.order_grid_state || secrets.TEL_ORDER_GRID_STATE }}
          TEL_LAST_GRID_LEVEL_PRICE: ${{ inputs.last_grid_level_price || secrets.TEL_LAST_GRID_LEVEL_PRICE }}
          TEL_ANTI_FOMO_STARTED_AT: ${{ inputs.anti_fomo_started_at || secrets.TEL_ANTI_FOMO_STARTED_AT }}
          TEL_ANTI_FOMO_REASON: ${{ secrets.TEL_ANTI_FOMO_REASON }}
          TEL_TRANCHE_COUNT_IN_ZONE: ${{ inputs.tranche_count_in_zone || secrets.TEL_TRANCHE_COUNT_IN_ZONE }}
          TEL_MAX_TRANCHES_PER_ZONE: ${{ inputs.max_tranches_per_zone || secrets.TEL_MAX_TRANCHES_PER_ZONE }}
          TEL_LAST_TRANCHE_PRICE: ${{ inputs.last_tranche_price || secrets.TEL_LAST_TRANCHE_PRICE }}
          TEL_PLANNED_ENTRY_PRICE: ${{ inputs.planned_entry_price || secrets.TEL_PLANNED_ENTRY_PRICE }}
        run: node dist/src/automation/runner.js
      - name: Append journal commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/prospective/journal.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "automation: append prospective surveillance journal"
          git push origin HEAD:main
      - name: Weekly angle availability and veto summary
        if: success()
        env:
          PROSPECTIVE_JOURNAL: research/prospective/journal.jsonl
        run: node scripts/summarize-tel-vetoes.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare public decision page
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-decision
          if test -s artifacts/tel-decision.html; then
            cp artifacts/tel-decision.html public-decision/index.html
          else
            echo '<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Décision TEL</title><main><h1>ATTENDRE</h1><p>Écran indisponible pour ce run. Données non évaluées.</p></main></html>' > public-decision/index.html
          fi
      - name: Upload decision page only
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-decision
      - name: Deploy decision page
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Alert summary
        if: always()
        run: |
          echo "Prospective surveillance completed; journal is append-only and hash chained." >> "$GITHUB_STEP_SUMMARY"
