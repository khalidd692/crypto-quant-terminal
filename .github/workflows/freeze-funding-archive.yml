name: Freeze Phase 3 funding archive

on:
  pull_request:
    paths:
      - "src/research/frozen-funding.ts"
      - "src/adapters/binance/vision-public-data.ts"
      - "scripts/freeze-funding-archive.mjs"
      - "tests/frozen-funding.ts"
      - ".github/workflows/freeze-funding-archive.yml"

jobs:
  freeze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/freeze-funding-archive.mjs
      - run: npm run build
      - run: node dist/tests/frozen-funding.js
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-frozen-btcusdt-funding-2020-2025
          path: research/funding/frozen-btcusdt-2020-2025
          if-no-files-found: error
          retention-days: 90
