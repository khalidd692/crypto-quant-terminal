name: Deploy KHALYON
on:
  # Publish promptly after application/workflow changes reach main.
  # Ignore runtime-only churn; the scheduled run still refreshes live context.
  push:
    branches: ["main"]
    paths-ignore:
      - "research/prospective/journal.jsonl"
      - "khalyon/data/context-snapshot.json"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: khalyon-pages
  cancel-in-progress: false
jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: khalyon-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout KHALYON at event SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Checkout matching surveillance journal at same SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: main-data
          sparse-checkout: |
            /research/prospective/journal.jsonl
            /reports/**
            /research/experiments/**
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build context providers
        run: npm run build
      - name: Generate sealed context snapshot
        env:
          KHALYON_CONTEXT_TIMEOUT_MS: "45000"
        run: node scripts/generate-context-snapshot.mjs
      - name: Build and verify KHALYON
        env:
          PROSPECTIVE_JOURNAL: main-data/research/prospective/journal.jsonl
          KHALYON_NLP_REPORT: main-data/reports/latest_nlp_signals.md
        run: |
          echo "KHALYON HEAD: $GITHUB_SHA"
          node khalyon/build.mjs
      - name: Write public build manifest
        env:
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const snapshot = JSON.parse(readFileSync("khalyon/data/phase3-diagnostic-snapshot.json", "utf8"));
          const manifest = {
            schemaVersion: 1,
            sourceCommit: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            sourceRef: process.env.SOURCE_REF,
            workflowRunId: process.env.RUN_ID,
            workflowRunAttempt: Number(process.env.RUN_ATTEMPT),
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.RUN_ID}`,
            builtAt: new Date().toISOString(),
            datasetVersion: snapshot.datasetVersion,
            holdoutConsumed: snapshot.holdoutConsumed,
            adr: snapshot.adr,
            historicalVerdict: snapshot.historicalVerdict
          };
          if (!/^[0-9a-f]{40}$/.test(manifest.sourceCommit ?? "")) throw new Error("Invalid KHALYON build source SHA");
          writeFileSync("khalyon/build-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log("KHALYON public build manifest: " + manifest.sourceCommit);
          NODE
          node tests/khalyon-ui-integrity.mjs
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.64.0 && npx playwright install chromium --with-deps
      - name: Serve KHALYON
        run: python3 -m http.server 4173 --directory khalyon > /tmp/khalyon-http.log 2>&1 &
      - name: Playwright render and screenshots
        run: npx playwright test tests/khalyon-playwright.spec.mjs --workers=1
      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v4
        with:
          name: khalyon-playwright-screenshots
          path: artifacts/khalyon-*.png
      - name: Upload KHALYON
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./khalyon"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
