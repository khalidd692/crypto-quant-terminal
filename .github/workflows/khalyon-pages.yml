name: Deploy KHALYON
on:
  # Offset from the surveillance schedule to avoid simultaneous duplicate deployments.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Prospective surveillance"]
    types: [completed]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: khalyon-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    environment:
      name: khalyon-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout KHALYON
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Checkout latest surveillance journal from main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main-data
          sparse-checkout: |
            /research/prospective/journal.jsonl
            /reports/**
            /research/experiments/**
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build context providers
        run: npm run build
      - name: Generate sealed context snapshot
        env:
          KHALYON_CONTEXT_TIMEOUT_MS: "45000"
        run: node scripts/generate-context-snapshot.mjs
      - name: Build and verify KHALYON
        env:
          PROSPECTIVE_JOURNAL: main-data/research/prospective/journal.jsonl
          KHALYON_NLP_REPORT: main-data/reports/latest_nlp_signals.md
        run: |
          echo "KHALYON HEAD: $GITHUB_SHA"
          node khalyon/build.mjs
          node tests/khalyon-ui-integrity.mjs
      - name: Write public build manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const snapshot = JSON.parse(readFileSync("khalyon/data/phase3-diagnostic-snapshot.json", "utf8"));
          const manifest = {
            schemaVersion: 1,
            sourceCommit: process.env.SOURCE_COMMIT,
            sourceRef: process.env.SOURCE_REF,
            workflowRunId: process.env.RUN_ID,
            workflowRunAttempt: Number(process.env.RUN_ATTEMPT),
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.RUN_ID}`,
            builtAt: new Date().toISOString(),
            datasetVersion: snapshot.datasetVersion,
            holdoutConsumed: snapshot.holdoutConsumed,
            adr: snapshot.adr,
            historicalVerdict: snapshot.historicalVerdict
          };
          if (!/^[0-9a-f]{40}$/.test(manifest.sourceCommit ?? "")) throw new Error("Invalid KHALYON build source SHA");
          writeFileSync("khalyon/build-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log("KHALYON public build manifest: " + manifest.sourceCommit);
          NODE
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.64.0 && npx playwright install chromium --with-deps
      - name: Serve KHALYON
        run: python3 -m http.server 4173 --directory khalyon > /tmp/khalyon-http.log 2>&1 &
      - name: Playwright render and screenshots
        run: npx playwright test tests/khalyon-playwright.spec.mjs --workers=1
      - name: Persist hash-verified context snapshot to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main advanced during this build; refuse to publish a runtime built from stale main."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add khalyon/data/context-snapshot.json
          if git diff --cached --quiet; then
            echo "Context snapshot unchanged; no commit required."
          else
            git commit -m "chore(context): persist verified KHALYON snapshot"
            git push origin HEAD:main
          fi
      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v4
        with:
          name: khalyon-playwright-screenshots
          path: artifacts/khalyon-*.png
      - name: Upload KHALYON
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./khalyon"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
