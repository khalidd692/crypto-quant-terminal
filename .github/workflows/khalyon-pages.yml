name: Deploy KHALYON
on:
  push:
    branches: ["main","khalyon-ui"]
    paths: ["khalyon/**","scripts/generate-context-snapshot.mjs",".github/workflows/khalyon-pages.yml","tests/khalyon-ui-integrity.mjs","tests/khalyon-playwright.spec.mjs","src/context/**","src/surveillance/**","src/risk/**","src/automation/**","research/prospective/journal.jsonl","research/funding/FROZEN_ARCHIVE_LOCK.json","docs/phase3-closure-report.md","package.json","package-lock.json"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Prospective surveillance"]
    types: [completed]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: khalyon-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: khalyon-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout KHALYON
        uses: actions/checkout@v5
        with:
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'schedule') && 'main' || github.ref_name }}
      - name: Checkout latest surveillance journal from main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main-data
          sparse-checkout: |
            research/prospective/journal.jsonl
            reports
            research/experiments
          sparse-checkout-cone-mode: true
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build context providers
        run: npm run build
      - name: Generate sealed context snapshot
        env:
          KHALYON_CONTEXT_TIMEOUT_MS: "45000"
        run: node scripts/generate-context-snapshot.mjs
      - name: Build and verify KHALYON
        env:
          PROSPECTIVE_JOURNAL: main-data/research/prospective/journal.jsonl
          KHALYON_NLP_REPORT: main-data/reports/latest_nlp_signals.md
        run: |
          echo "KHALYON HEAD: $GITHUB_SHA"
          node khalyon/build.mjs
          node tests/khalyon-ui-integrity.mjs
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.64.0 && npx playwright install chromium --with-deps
      - name: Serve KHALYON
        run: python3 -m http.server 4173 --directory khalyon > /tmp/khalyon-http.log 2>&1 &
      - name: Playwright render and screenshots
        run: npx playwright test tests/khalyon-playwright.spec.mjs --workers=1
      - name: Persist hash-verified context snapshot to main
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::warning::main advanced during this build; preserving the existing committed snapshot and retrying on the next refresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add khalyon/data/context-snapshot.json
          if git diff --cached --quiet; then
            echo "Context snapshot unchanged; no commit required."
          else
            git commit -m "chore(context): persist verified KHALYON snapshot"
            git push origin HEAD:main || echo "::warning::snapshot push raced with another main update; next refresh will retry."
          fi
      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v4
        with:
          name: khalyon-playwright-screenshots
          path: artifacts/khalyon-*.png
      - name: Upload KHALYON
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./khalyon"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
