<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050a10"><title>KHALYON — Quantitative Intelligence</title><style>
:root{--bg:#050a10;--panel:#0b131d;--panel2:#0e1823;--line:#1b2a38;--text:#e8f0f6;--muted:#7e91a2;--cyan:#35d5e8;--green:#35d28a;--amber:#f2b84b;--red:#ff5d6c;--purple:#9d7cff}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,sans-serif}button{font:inherit}body{min-height:100vh}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);background:#071019;padding:18px 12px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 22px}.mark{width:30px;height:30px;border:1px solid var(--cyan);border-radius:9px;display:grid;place-items:center;color:var(--cyan);font-weight:800}.brand b{letter-spacing:.18em;font-size:12px}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.12em}.section{color:#53697b;font-size:9px;letter-spacing:.16em;margin:16px 9px 7px}.nav{display:block;width:100%;border:0;background:transparent;color:#9cafbd;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer}.nav:hover,.nav.active{background:#0e1b27;color:#eafcff}.nav.active{box-shadow:inset 2px 0 var(--cyan)}.main{min-width:0}.top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#071019ee;position:sticky;top:0;z-index:4}.right{display:flex;gap:8px;align-items:center}.pill,.badge{border:1px solid var(--line);border-radius:5px;padding:4px 8px;color:var(--muted);font-size:9px}.badge.real{border-color:#1e664d;color:var(--green)}.badge.sim{border-color:#6d5424;color:var(--amber)}.dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;margin-right:5px}.content{padding:24px;max-width:1500px;margin:auto}.eyebrow{color:var(--cyan);font-size:9px;letter-spacing:.16em}.title{font-size:24px;margin:4px 0}.subtitle{color:var(--muted);margin-bottom:14px}.grid{display:grid;gap:10px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(180deg,#0c1620,#0a131c);border:1px solid var(--line);border-radius:9px;padding:15px}.card h3{margin:0 0 7px;font-size:12px}.label{color:#718596;font-size:9px;letter-spacing:.08em;text-transform:uppercase}.metric{font-size:24px;margin-top:7px}.muted{color:var(--muted)}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.cyan{color:var(--cyan)}.code{background:#050a0f;border:1px solid #142330;border-radius:6px;padding:12px;overflow:auto;color:#a6bbc9;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid #142330;text-align:left}th{color:#64798a;font-size:9px;text-transform:uppercase;letter-spacing:.08em}td{font-size:11px}.tag{font-size:8px;padding:3px 6px;border:1px solid var(--line);border-radius:4px}.tag.green{color:var(--green);border-color:#1e664d}.tag.amber{color:var(--amber);border-color:#6d5424}.tag.red{color:var(--red);border-color:#71343d}.hero{display:flex;gap:10px;align-items:stretch}.hero .state{min-width:260px}.search{display:flex;gap:8px}.search input{flex:1;background:#071019;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:6px}.search button{background:#0c2930;color:var(--cyan);border:1px solid #1d6974;border-radius:6px;padding:0 16px}.footer{color:#526676;text-align:center;padding:28px 0 8px;font-size:9px}.mobile-menu{display:none;background:none;border:0;color:var(--text);font-size:20px}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;z-index:10;left:-240px;transition:.2s;width:220px}.sidebar.open{left:0}.mobile-menu{display:block}.content{padding:16px}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}.content{padding:12px}.title{font-size:20px}}
</style></head><body><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">K</div><div><b>KHALYON</b><small>QUANTITATIVE INTELLIGENCE</small></div></div><div class="section">DECISION</div><button class="nav active" data-page="decision">Puis-je acheter maintenant ?</button><button class="nav" data-page="position">Position</button><button class="nav" data-page="context">Contexte</button><button class="nav" data-page="journal">Journal / Bilan</button><div class="section">EXPLORATION</div><button class="nav" data-page="market">Market Intelligence</button><button class="nav" data-page="experiments">Research Experiments</button><div class="section">RESEARCH LAB</div><button class="nav" data-page="lab">Advanced Quant Lab</button><button class="nav" data-page="nlp">NLP Retrieval</button><button class="nav" data-page="diagnostics">Diagnostics</button><button class="nav" data-page="datasets">Datasets</button><button class="nav" data-page="verdicts">Verdicts</button><div class="section">SURVEILLANCE</div><button class="nav" data-page="surveillance">Surveillance TEL</button><div class="section">GOVERNANCE</div><button class="nav" data-page="governance">Research Governance</button></aside><main class="main"><header class="top"><button class="mobile-menu" id="menu">☰</button><div class="pill">READ-ONLY · BUILD-VERIFIED</div><div class="right"><span class="pill"><span class="dot"></span>UI OPERATIONAL</span></div></header><section class="content"><div id="app"></div><div class="footer">KHALYON — Evidence before opinion · External context is descriptive and fail-closed</div></section></main></div>
<script>
const app=document.getElementById("app");let runtime=null;const nav=[...document.querySelectorAll(".nav")],pages={};
const esc=v=>String(v??"UNAVAILABLE").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");const fmt=v=>v===null||v===undefined?"UNAVAILABLE":typeof v==="number"?v.toLocaleString(undefined,{maximumFractionDigits:4}):esc(v);
const real=(source,date)=>'<div class="badge real">RÉEL · '+esc(source)+' · '+esc(date)+'</div>';const sim='<div class="badge sim">SIMULÉ</div>';
function shell(title,sub,badge,body){return '<div class="eyebrow">KHALYON / RESEARCH INFRASTRUCTURE</div><h1 class="title">'+title+'</h1><div class="subtitle">'+sub+'</div>'+badge+body}
pages.market=()=>{const r=runtime,c=r.context,m=c.market;return shell("Market Intelligence","Dernier snapshot de contexte scellé au build; descriptif, aucune inférence d'edge.",real("CONTEXT SNAPSHOT "+c.snapshotHash,c.asOf),'<div class="grid g4" style="margin-top:10px"><div class="card"><div class="label">Global crypto cap</div><div class="metric">'+fmt(m.totalMarketCapQuote)+'</div></div><div class="card"><div class="label">BTC dominance</div><div class="metric">'+fmt(m.btcDominancePct)+'%</div></div><div class="card"><div class="label">Funding rate</div><div class="metric">'+fmt(m.fundingRatePct)+'</div></div><div class="card"><div class="label">Open interest</div><div class="metric">'+fmt(m.openInterestQuote)+'</div></div></div><div class="grid g4" style="margin-top:10px"><div class="card"><div class="label">Fear & Greed</div><div class="metric">'+fmt(m.sentimentScore)+'</div></div><div class="card"><div class="label">Stablecoin cap</div><div class="metric">'+fmt(c.liquidity.stablecoinMarketCapQuote)+'</div></div><div class="card"><div class="label">Policy rate</div><div class="metric">'+fmt(c.macro.policyRatePct)+'%</div></div><div class="card"><div class="label">Dollar index</div><div class="metric">'+fmt(c.macro.dollarIndex)+'</div></div></div><div class="card" style="margin-top:10px"><h3>Provenance externe</h3><div class="table-wrap"><table><thead><tr><th>Champ</th><th>Source</th><th>Disponible</th><th>Snapshot hash</th><th>Statut</th></tr></thead><tbody>'+c.provenance.slice(0,12).map(p=>'<tr><td>'+esc(p.field)+'</td><td>'+esc(p.source)+'</td><td>'+esc(p.availableAt)+'</td><td>'+esc(p.sourceSnapshotHash)+'</td><td>'+esc(p.status)+'</td></tr>').join("")+'</tbody></table></div></div>')};
pages.decision=()=>{const d=runtime.decision;return shell("Puis-je acheter maintenant ?","Mode lecture seule — le moteur de décision ne passe aucun ordre.",d.source==="UNAVAILABLE"?sim:real("PROSPECTIVE JOURNAL",d.asOf??"UNAVAILABLE"),'<div class="card" style="margin-top:10px"><div class="test" style="font-weight:800">EN TEST — SANS ARGENT</div><div class="metric '+(d.state==="ENTRER"?"ok":d.state==="UNAVAILABLE"?"warn":"bad")+'">'+esc(d.state)+'</div><p>'+esc(d.reason)+'</p><div class="muted">Risque max configuré : '+(d.riskMaxPct*100).toFixed(2)+' % du capital SWING · montant : '+fmt(d.riskMaxQuote)+'</div></div><div class="grid g2" style="margin-top:10px">'+Object.entries(d.checks).map(([k,v])=>'<div class="card"><div class="label">'+esc(k)+'</div><div class="metric">'+esc(v)+'</div></div>').join("")+'</div><div class="card" style="margin-top:10px"><div class="muted">Statistiques historiques, pas une prévision. Donnée indisponible = UNAVAILABLE.</div></div>')};
pages.position=()=>{const p=runtime.position;return shell("Position","Poche SWING uniquement; CORE_HOLD reste intouchable.",p.status==="UNAVAILABLE"?sim:real(p.source,runtime.context.asOf),'<div class="card" style="margin-top:10px"><div class="metric warn">'+esc(p.status)+'</div><p class="muted">'+esc(p.reason)+'</p></div>')};
pages.context=()=>{const r=runtime,c=r.context,e=r.contextExtended??{};return shell("Contexte","Macro, corrélations et sentiment — descriptif, instable et fail-closed.",real("CONTEXT SNAPSHOT "+c.snapshotHash,c.asOf),'<div class="grid g3" style="margin-top:10px"><div class="card"><div class="label">Régime macro</div><div class="metric">'+esc(c.macroRegime.regime)+'</div><div class="muted">'+esc(c.macroRegime.rationale)+'</div></div><div class="card"><div class="label">Sentiment social</div><div class="metric">'+esc(e.socialSentiment?.temperature??"UNAVAILABLE")+'</div><div class="muted">indice de température, bruité et manipulable, pas une prévision</div></div><div class="card"><div class="label">TEL circulating supply</div><div class="metric">'+fmt(e.fundamentalsTel?.circulatingSupply)+'</div></div></div><div class="card" style="margin-top:10px"><h3>Corrélations</h3><table><thead><tr><th>Série</th><th>30j</th><th>90j</th><th>180j</th></tr></thead><tbody>'+Object.entries(e.correlations??{}).map(([k,v])=>'<tr><td>'+esc(k)+'</td>'+[30,90,180].map(w=>{const x=v.find(y=>y.windowDays===w);return '<td>'+fmt(x?.coefficient??null)+'</td>'}).join("")+'</tr>').join("")+'</tbody></table><p class="muted">corrélation descriptive, pas causale, instable</p></div>')};
pages.journal=()=>{const s=runtime.surveillance;return shell("Journal / Bilan","Observations prospectives uniquement; nombre d'observations affiché, aucune fiabilité avant 4–8 semaines.",s.journalTail?.length?real("PROSPECTIVE JOURNAL",s.recordedAt??"UNAVAILABLE"):sim,'<div class="card" style="margin-top:10px"><h3>Dernières observations</h3><div class="code">'+(s.journalTail?.length?s.journalTail.map(x=>esc(JSON.stringify(x))).join("<br>"):"UNAVAILABLE")+'</div></div><div class="card" style="margin-top:10px"><div class="label">Critère de confiance</div><div class="muted">EN TEST pendant au moins 4 à 8 semaines prospectives. Aucune statistique courte n est présentée comme une preuve.</div></div>')};
pages.experiments=()=>shell("Research Experiments","Entrées de démonstration uniquement; aucune donnée simulée n'est présentée comme preuve.",sim,'<div class="card"><div class="tag amber">SIMULÉ</div><h3 style="margin-top:10px">EXP-DEMO-0147</h3><p class="muted">Funding dislocation mean-reversion — DEMO DATASET — NOT EVIDENCE.</p></div>');
pages.lab=()=>{const r=runtime;return shell("Advanced Quant Lab","Système quantitatif isolé du code de stratégie de production.",real("ARTIFACT "+r.source.sha256,r.generatedAt),'<div class="grid g4" style="margin-top:10px"><div class="card"><div class="label">Historical data</div><div class="metric cyan">'+esc(r.governance.historical)+'</div></div><div class="card"><div class="label">Holdout</div><div class="metric ok">'+esc(r.governance.holdout)+'</div></div><div class="card"><div class="label">ADR</div><div class="metric cyan">'+esc(r.source.adr)+'</div></div><div class="card"><div class="label">Verdict</div><div class="metric bad">'+esc(r.governance.verdict)+'</div></div></div>')};
pages.nlp=()=>shell("NLP Retrieval","Aperçu simulé; aucune récupération live n'est revendiquée.",sim,'<div class="card"><div class="search"><input id="q" placeholder="Search research evidence..." value="MTL"><button onclick="searchDemo()">Retrieve</button></div><div id="results" style="margin-top:14px"></div></div>');
pages.diagnostics=()=>{const r=runtime,v=r.exclusionAccounting.validation,t=r.exclusionAccounting.test;return shell("Diagnostics","Comptabilité historique et gates de recherche.",real("ARTIFACT "+r.source.sha256,r.generatedAt),'<div class="grid g4" style="margin-top:10px"><div class="card"><div class="label">Validation observations</div><div class="metric">'+v.totalObservations.toLocaleString()+'</div><div class="muted">'+v.cleanEligible.toLocaleString()+' clean · '+v.ambiguous.toLocaleString()+' ambiguous</div></div><div class="card"><div class="label">Validation exclusions</div><div class="metric warn">'+v.excludedNonAmbiguous.toLocaleString()+'</div></div><div class="card"><div class="label">Test observations</div><div class="metric">'+t.totalObservations.toLocaleString()+'</div><div class="muted">'+t.cleanEligible.toLocaleString()+' clean · '+t.ambiguous.toLocaleString()+' ambiguous</div></div><div class="card"><div class="label">Test exclusions</div><div class="metric warn">'+t.excludedNonAmbiguous.toLocaleString()+'</div></div></div><div class="card" style="margin-top:10px"><h3>Accounting</h3><div class="code">VALIDATION → '+(v.cleanEligible+v.ambiguous+v.excludedNonAmbiguous)+' = '+v.totalObservations+'<br>TEST → '+(t.cleanEligible+t.ambiguous+t.excludedNonAmbiguous)+' = '+t.totalObservations+'</div></div>')};
pages.datasets=()=>{const r=runtime;return shell("Datasets","Entrées historiques gelées et provenance de recherche.",real("ARTIFACT "+r.source.sha256,r.generatedAt),'<div class="grid g2" style="margin-top:10px"><div class="card"><h3>Dataset gelé</h3><div class="metric cyan">'+esc(r.source.datasetVersion)+'</div><div class="label">ADR</div><div>'+esc(r.source.adr)+'</div></div><div class="card"><h3>Funding archive lock</h3><div class="code">archiveSha256 = '+esc(r.funding.archiveSha256)+'<br>githubArtifactDigest = '+esc(r.funding.githubArtifactDigest)+'</div></div></div><div class="card" style="margin-top:10px"><h3>Context snapshot</h3><div class="code">RUN → '+esc(r.context.runId)+'<br>AS OF → '+esc(r.context.asOf)+'<br>HASH → '+esc(r.context.snapshotHash)+'</div></div>')};
pages.verdicts=()=>{const r=runtime;return shell("Verdicts","Jugement lu depuis l'artefact gouvernance vérifié au build.",real("ARTIFACT "+r.source.sha256,r.generatedAt),'<div class="hero" style="margin-top:10px"><div class="card state" style="flex:1"><div class="label">HISTORICAL RESEARCH VERDICT</div><div class="metric bad">'+esc(r.governance.verdict)+'</div><p class="muted">Champ lu depuis le snapshot diagnostic et contrôlé contre le rapport de clôture.</p><div class="grid g3"><div><div class="label">HISTORICAL</div><div>'+esc(r.governance.historical)+'</div></div><div><div class="label">HOLDOUT</div><div class="ok">'+esc(r.governance.holdout)+'</div></div><div><div class="label">ADR</div><div class="cyan">'+esc(r.source.adr)+'</div></div></div></div><div class="card"><div class="label">STATUS</div><div class="metric bad">'+esc(r.governance.verdict)+'</div></div></div>')};
pages.surveillance=()=>{const s=runtime.surveillance;return shell("Surveillance TEL","État courant et checklist pré-trade, lecture seule. Les alertes restent prospectives.",real("JOURNAL "+(s.recordedAt??"UNAVAILABLE"),runtime.context.asOf),'<div class="grid g3" style="margin-top:10px"><div class="card"><div class="label">État courant</div><div class="metric '+(s.state==="NE_PAS_ENTRER"||s.state==="SORTIR"?"bad":"warn")+'">'+esc(s.state)+'</div><div class="muted">'+esc(s.recordedAt)+'</div></div><div class="card"><div class="label">Raisons</div><div class="code">'+s.reasons.map(esc).join("<br>")+'</div></div><div class="card"><div class="label">Checklist</div><div class="code">'+Object.entries(s.checklist).map(([k,v])=>esc(k)+" = "+esc(v)).join("<br>")+'</div></div></div><div class="card" style="margin-top:10px"><h3>Dernières lignes du journal</h3><div class="code">'+s.journalTail.map(x=>esc(JSON.stringify(x))).join("<br>")+'</div></div>')};
pages.governance=()=>{const r=runtime;return shell("Research Governance","Contrôles de séparation entre recherche, holdout et production.",real("ARTIFACT "+r.source.sha256,r.generatedAt),'<div class="grid g3" style="margin-top:10px"><div class="card"><div class="label">ADR</div><div class="metric cyan">'+esc(r.source.adr)+'</div></div><div class="card"><div class="label">Holdout</div><div class="metric ok">'+esc(r.governance.holdout)+'</div></div><div class="card"><div class="label">Verdict</div><div class="metric bad">'+esc(r.governance.verdict)+'</div></div></div>')};
async function render(page){if(!runtime){const response=await fetch("data/runtime.json",{cache:"no-store"});if(!response.ok)throw new Error("KHALYON runtime artifact unavailable");runtime=await response.json();}app.innerHTML=pages[page]();nav.forEach(n=>n.classList.toggle("active",n.dataset.page===page));location.hash=page}
function searchDemo(){document.getElementById("results").innerHTML='<div class="card"><div class="tag amber">SIMULÉ</div><p class="muted">Recherche preview uniquement; corpus live non revendiqué.</p></div>'}
nav.forEach(n=>n.addEventListener("click",()=>{render(n.dataset.page);document.getElementById("sidebar").classList.remove("open")}));document.getElementById("menu").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));render(location.hash.slice(1) in pages?location.hash.slice(1):"market").catch(e=>{app.innerHTML='<div class="card"><div class="tag red">BUILD/ARTIFACT ERROR</div><div class="code">'+esc(e.message)+'</div></div>'});
</script></body></html>
